{% extends "_base.html" %}
{% block content %}
<div class="page-stack security-page">
  <section class="settings-intro panel"><span class="settings-intro-icon">⌑</span><div><span class="eyebrow">ACCOUNT & SECURITY</span><h2>계정 보안과 관리.</h2><p>비밀번호 변경과 신중한 회원탈퇴를 관리해요.</p></div></section>
  <section class="panel settings-card" id="password-settings"><div class="settings-card-heading"><span class="settings-section-icon profile">⌑</span><div><span class="eyebrow">ACCOUNT SECURITY</span><h2>비밀번호 변경</h2><p>현재 비밀번호를 확인한 뒤 새 비밀번호를 저장해요.</p></div></div>
    <form class="settings-feature-form" method="post" action="{{ url_for('change_password') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-field"><span>현재 비밀번호</span><input type="password" name="current_password" autocomplete="current-password" required></label>
      <div class="settings-field-grid"><label class="form-field"><span>새 비밀번호</span><input type="password" name="new_password" minlength="8" autocomplete="new-password" required><small>8자 이상 입력해 주세요.</small></label><label class="form-field"><span>새 비밀번호 확인</span><input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></label></div>
      <div class="feature-form-actions"><button class="button button-secondary" type="submit">비밀번호 변경</button></div>
    </form>
  </section>
  <section class="panel settings-card danger-zone" id="account-settings"><div class="settings-card-heading"><span class="settings-section-icon danger">!</span><div><span class="eyebrow">ACCOUNT CONTROL</span><h2>회원탈퇴</h2><p>탈퇴 시 계정과 관련된 공부 기록·친구 연결·알림이 삭제됩니다.</p></div></div>
    <form class="settings-feature-form" method="post" action="{{ url_for('delete_account') }}" data-confirm="정말 탈퇴할까요? 계정과 관련 데이터는 삭제 후 복구할 수 없습니다."><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-field"><span>가입 이메일 다시 입력</span><input type="email" name="confirm_email" autocomplete="email" placeholder="{{ current_user['email'] }}" required><small>계정 삭제 전 이메일과 현재 비밀번호를 모두 확인해요.</small></label>
      <label class="form-field"><span>현재 비밀번호</span><input type="password" name="current_password" autocomplete="current-password" required></label>
      <div class="feature-form-actions"><button class="button button-danger" type="submit">이메일 확인 후 회원탈퇴</button></div>
    </form>
  </section>
  <p class="security-caution">회원탈퇴는 되돌릴 수 없습니다. 이메일뿐 아니라 현재 비밀번호도 확인해야 진행돼요.</p>
</div>
{% endblock %}
